name: getnet-multi-agent

services:
  api:
    image: getnet-multi-agent:${REV:-dev}
    build:
      context: .
      args:
        REV: ${REV:-dev}
    env_file: .env
    environment:
      LLM_MODE: ${LLM_MODE:-live}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - state:/app/data/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  state:
